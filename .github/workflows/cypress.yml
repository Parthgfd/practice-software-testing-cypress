name: Cypress Tests 

on:
  push:
    branches:
      - main

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run Cypress API tests
      run: npx cypress run --spec "cypress/e2e/api/productsApi.cy.js"

    - name: Upload Mochawesome report
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: mochawesome-report
          path: mochawesome-report/
          if-no-files-found: warn

    - name: Upload Cypress failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
          name: cypress-failure-diagnostics
          path: |
           cypress/screenshots/
           cypress/videos/
          if-no-files-found: warn
                             
    - name: Add test run summary
      if: always()
      shell: bash
      run: |
         echo "## Cypress API Test Run" >> "$GITHUB_STEP_SUMMARY"
         echo "" >> "$GITHUB_STEP_SUMMARY"
         echo "- **Workflow:** Cypress Tests" >> "$GITHUB_STEP_SUMMARY"
         echo "- **Test suite:** productsApi.cy.js" >> "$GITHUB_STEP_SUMMARY"
         echo "- **Report:** Download the mochawesome-report artifact from this workflow run." >> "$GITHUB_STEP_SUMMARY"